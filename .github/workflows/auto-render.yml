name: Auto render

# Runs by itself when you change your script, recording, music or audio
# settings on main (for example by editing assets/script.txt in the GitHub app).
#   - Every change: a free preview (8 stills, no ElevenLabs credits).
#   - Put #render in the commit message: the full video with voiceover.
# Results appear as draft releases in the Releases tab.

on:
  push:
    branches: [auto-test]
    paths:
      - assets/script.txt
      - assets/voiceover.mp3
      - assets/music/**
      - assets/audio.json

permissions:
  contents: write

concurrency:
  group: auto-render
  cancel-in-progress: false

jobs:
  preview:
    if: ${{ !contains(github.event.head_commit.message, '#render') }}
    uses: ./.github/workflows/render.yml
    with:
      engine: remotion-preview
      publish_release: true
    secrets: inherit

  full:
    if: ${{ contains(github.event.head_commit.message, '#render') }}
    uses: ./.github/workflows/render.yml
    with:
      engine: remotion
      script: assets/__demo__.txt
      chunks: "2"
      publish_release: true
    secrets: inherit

  cleanup:
    needs: [preview, full]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Check and delete the test drafts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for t in preview-${{ github.run_id }} render-${{ github.run_id }}; do
            if gh release view "$t" -R "$GITHUB_REPOSITORY" --json tagName,isDraft,assets -q '"\(.tagName) draft=\(.isDraft) files=\([.assets[].name]|join(","))"'; then
              gh release delete "$t" -R "$GITHUB_REPOSITORY" -y || echo "could not delete $t"
            fi
          done
          # also remove the draft left by the first test run
          gh release delete preview-42592264681 -R "$GITHUB_REPOSITORY" -y || true
          true
