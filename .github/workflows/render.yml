name: Render motion video

on:
  workflow_dispatch:
    inputs:
      engine:
        description: "remotion = full video; remotion-preview = 8 still frames in a few minutes (no ElevenLabs credits)"
        type: choice
        default: remotion-preview
        options:
          - remotion-preview
          - remotion
          - hyperframes
      composition:
        description: "Remotion composition (Reel or Explainer)"
        type: string
        default: Reel
      script:
        description: "Script for an ElevenLabs voiceover (needs ELEVENLABS_API_KEY secret)"
        type: string
        default: assets/script.txt
      voice_id:
        description: "ElevenLabs voice ID"
        type: string
        default: JBFqnCBsd6RMkjVDRZzb
      voiceover:
        description: "Recorded narration, used when there is no script (blank = silent)"
        type: string
        default: assets/voiceover.mp3
      size:
        description: "Video size"
        type: choice
        default: 1080x1920
        options:
          - 1280x720
          - 1920x1080
          - 1080x1920
      fps:
        description: "Frames per second"
        type: choice
        default: "30"
        options:
          - "24"
          - "30"
      chunks:
        description: "Parallel render jobs (more = faster for heavy scenes)"
        type: choice
        default: "1"
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "6"
      whisper_model:
        description: "Whisper model for captions"
        type: choice
        default: base
        options:
          - tiny
          - base
          - small
      publish_release:
        description: "Attach the final MP4 to a draft release (easy phone download)"
        type: boolean
        default: true

  # Lets other workflows (the test workflow) run this one with fixed settings.
  workflow_call:
    inputs:
      engine: {type: string, default: remotion-preview}
      composition: {type: string, default: Reel}
      script: {type: string, default: assets/script.txt}
      voice_id: {type: string, default: JBFqnCBsd6RMkjVDRZzb}
      voiceover: {type: string, default: assets/voiceover.mp3}
      size: {type: string, default: 1080x1920}
      fps: {type: string, default: "30"}
      chunks: {type: string, default: "1"}
      whisper_model: {type: string, default: base}
      publish_release: {type: boolean, default: false}
      artifact_prefix: {type: string, default: ""}
    secrets:
      ELEVENLABS_API_KEY: {required: false}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- Remotion
  prepare:
    if: inputs.engine != 'hyperframes'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pick script
        id: script
        env:
          SCRIPT: ${{ inputs.script }}
        run: |
          if [ -n "$SCRIPT" ] && [ -f "$SCRIPT" ]; then
            echo "path=$SCRIPT" >> "$GITHUB_OUTPUT"; echo "demo=false" >> "$GITHUB_OUTPUT"
          elif [ -f assets/script.example.txt ]; then
            echo "::notice::No script at '$SCRIPT' - using the demo script (no voiceover)."
            echo "path=assets/script.example.txt" >> "$GITHUB_OUTPUT"; echo "demo=true" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"; echo "demo=true" >> "$GITHUB_OUTPUT"
          fi

      # Reuse the last ElevenLabs voiceover when the script and voice are unchanged,
      # so re-renders after visual tweaks cost no credits.
      - name: Restore saved voiceover
        if: inputs.engine == 'remotion' && steps.script.outputs.demo == 'false'
        uses: actions/cache@v4
        with:
          path: build/tts
          key: elevenlabs-${{ inputs.voice_id }}-${{ hashFiles(steps.script.outputs.path) }}

      - name: Make or find narration
        id: audio
        env:
          SCRIPT: ${{ steps.script.outputs.path }}
          DEMO: ${{ steps.script.outputs.demo }}
          VOICE_ID: ${{ inputs.voice_id }}
          VOICEOVER: ${{ inputs.voiceover }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ENGINE: ${{ inputs.engine }}
        run: |
          mkdir -p build
          if [ -n "$VOICEOVER" ] && [ -f "$VOICEOVER" ]; then
            echo "Using the uploaded recording $VOICEOVER (no ElevenLabs credits used)."
            cp "$VOICEOVER" build/voiceover.mp3
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "captions=whisper" >> "$GITHUB_OUTPUT"
          elif [ "$ENGINE" = "remotion" ] && [ "$DEMO" = "false" ] && [ -f build/tts/voiceover.mp3 ]; then
            echo "Reusing saved voiceover (script and voice unchanged) - no ElevenLabs credits used."
            cp build/tts/* build/
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "captions=elevenlabs" >> "$GITHUB_OUTPUT"
          elif [ "$ENGINE" = "remotion" ] && [ "$DEMO" = "false" ] && [ -n "$ELEVENLABS_API_KEY" ]; then
            python3 scripts/tts.py "$SCRIPT" --voice "$VOICE_ID" --out-dir build/tts
            cp build/tts/* build/
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "captions=elevenlabs" >> "$GITHUB_OUTPUT"
          else
            if [ "$ENGINE" = "remotion" ] && [ "$DEMO" = "false" ] && [ -z "$ELEVENLABS_API_KEY" ]; then
              echo "::warning::Found $SCRIPT but no ELEVENLABS_API_KEY secret, so no voiceover was made."
            fi
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "captions=none" >> "$GITHUB_OUTPUT"
            echo "No narration - timing comes from the script at ~3.2 words/sec."
          fi

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Whisper (faster-whisper)
        if: steps.audio.outputs.captions == 'whisper'
        run: pip install faster-whisper

      - name: Transcribe narration to captions
        if: steps.audio.outputs.captions == 'whisper'
        env:
          WHISPER_MODEL: ${{ inputs.whisper_model }}
        run: python3 scripts/transcribe.py build/voiceover.mp3 --out-dir build --model "$WHISPER_MODEL"

      - name: Build timeline (sections, repo data, sound cues)
        env:
          SCRIPT: ${{ steps.script.outputs.path }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$SCRIPT" ] && [ -f "$SCRIPT" ]; then
            python3 scripts/build_timeline.py --script "$SCRIPT"
          else
            echo "No script at '$SCRIPT' - skipping the Reel timeline."
          fi

      - name: Plan render
        id: plan
        env:
          AUDIO_FOUND: ${{ steps.audio.outputs.found }}
          SIZE: ${{ inputs.size }}
          FPS: ${{ inputs.fps }}
          CHUNKS: ${{ inputs.chunks }}
        run: |
          AUDIO=""
          if [ "$AUDIO_FOUND" = "true" ]; then AUDIO="build/voiceover.mp3"; fi
          python3 scripts/plan_chunks.py --audio "$AUDIO" --size "$SIZE" --fps "$FPS" --chunks "$CHUNKS"

      # Same audio.json = same sounds every render, and no repeat API calls.
      - name: Restore Openverse audio
        uses: actions/cache@v4
        with:
          path: build/audio
          key: openverse-${{ hashFiles('assets/audio.json', 'scripts/openverse_audio.py') }}-v3

      - name: Fetch music and sound effects from Openverse
        run: |
          if [ -f assets/audio.json ] && [ ! -f build/audio/CREDITS.txt ]; then
            python3 scripts/openverse_audio.py --config assets/audio.json --out build/audio || \
              echo "::warning::Openverse fetch failed - using generated sounds."
          fi
          [ -f build/audio/CREDITS.txt ] && cat build/audio/CREDITS.txt >> "$GITHUB_STEP_SUMMARY" || true

      - name: Synthesize sound effects
        run: |
          if [ -f build/sfx_cues.json ]; then python3 scripts/make_sfx.py build/sfx_cues.json; fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_prefix }}inputs
          path: build/
          if-no-files-found: error

  render:
    needs: prepare
    if: inputs.engine == 'remotion'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: true
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Chrome libraries
        run: |
          sudo apt-get update
          ASOUND=libasound2t64
          apt-cache show libasound2t64 >/dev/null 2>&1 || ASOUND=libasound2
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 \
            libgbm1 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libcups2 libpango-1.0-0 libcairo2 "$ASOUND"

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm ls remotion @remotion/cli @remotion/google-fonts --depth=0 || true

      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_prefix }}inputs
          path: build

      - name: Render chunk
        env:
          COMPOSITION: ${{ inputs.composition }}
          IDX: ${{ matrix.idx }}
          RANGE: ${{ matrix.range }}
        run: |
          mkdir -p out
          npx remotion render src/index.ts "$COMPOSITION" "out/part-$IDX.mp4" \
            --props=build/props.json \
            --frames="$RANGE" \
            --codec=h264 \
            --crf=20

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_prefix }}part-${{ matrix.idx }}
          path: out/part-${{ matrix.idx }}.mp4
          if-no-files-found: error

  assemble:
    needs: [prepare, render]
    if: inputs.engine == 'remotion'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.artifact_prefix }}part-*
          merge-multiple: true
          path: parts

      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_prefix }}inputs
          path: build

      - name: Join chunks, mix voice + SFX + music, make thumbnail
        run: |
          mkdir -p out
          for f in parts/part-*.mp4; do echo "file '$PWD/$f'"; done > list.txt
          ffmpeg -y -f concat -safe 0 -i list.txt -c copy out/silent.mp4
          python3 scripts/mix_audio.py out/silent.mp4 out/final.mp4

          ffmpeg -y -ss 00:00:02 -i out/final.mp4 -frames:v 1 -q:v 2 out/thumbnail.jpg
          cp build/captions.srt build/captions.json out/ 2>/dev/null || true
          cp build/audio/CREDITS.txt out/ 2>/dev/null || true
          rm -f out/silent.mp4
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_prefix }}final-video
          path: out/
          if-no-files-found: error

      - name: Draft release with the MP4
        if: inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXTRA=""; [ -f out/CREDITS.txt ] && EXTRA="out/CREDITS.txt"
          gh release create "render-${GITHUB_RUN_NUMBER}" out/final.mp4 out/thumbnail.jpg $EXTRA \
            --draft --title "Render #${GITHUB_RUN_NUMBER}" \
            --notes "Rendered by workflow run ${GITHUB_RUN_ID}. Audio credits (if any) are in CREDITS.txt."
          echo "Draft release created: Releases tab > Render #${GITHUB_RUN_NUMBER}" >> "$GITHUB_STEP_SUMMARY"

  # ----------------------------------------------------------------- Preview
  preview:
    needs: prepare
    if: inputs.engine == 'remotion-preview'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install ffmpeg and Chrome libraries
        run: |
          sudo apt-get update
          ASOUND=libasound2t64
          apt-cache show libasound2t64 >/dev/null 2>&1 || ASOUND=libasound2
          sudo apt-get install -y ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 \
            libgbm1 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libcups2 libpango-1.0-0 libcairo2 "$ASOUND"

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm ls remotion @remotion/cli @remotion/google-fonts --depth=0 || true

      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_prefix }}inputs
          path: build

      - name: Render 8 still frames
        env:
          COMPOSITION: ${{ inputs.composition }}
        run: |
          mkdir -p out/stills
          FRAMES=$(python3 scripts/preview_frames.py build/props.json)
          echo "Frames: $FRAMES"
          # Bundle once so each still doesn't rebuild the project.
          ENTRY=src/index.ts
          if npx remotion bundle src/index.ts --out-dir=bundle; then ENTRY=bundle; fi
          i=0
          for F in $FRAMES; do
            OUT="out/stills/$(printf %02d $i).png"
            npx remotion still "$ENTRY" "$COMPOSITION" "$OUT" --props=build/props.json --frame="$F" \
              || npx remotion still src/index.ts "$COMPOSITION" "$OUT" --props=build/props.json --frame="$F"
            i=$((i+1))
          done

      - name: Make contact sheet
        run: |
          N=$(ls out/stills/*.png | wc -l)
          ffmpeg -y -framerate 1 -pattern_type glob -i 'out/stills/*.png' \
            -vf "scale=540:-2,tile=4x$(( (N + 3) / 4 )):padding=8:color=black" -frames:v 1 out/preview.jpg

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_prefix }}preview
          path: out/
          if-no-files-found: error

      - name: Draft release with the preview
        if: inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "preview-${GITHUB_RUN_NUMBER}" out/preview.jpg \
            --draft --title "Preview #${GITHUB_RUN_NUMBER}" \
            --notes "8 still frames from workflow run ${GITHUB_RUN_ID}. Approve the look, then run with engine = remotion."

  # ------------------------------------------------------------- HyperFrames
  hyperframes:
    if: inputs.engine == 'hyperframes'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Require a HyperFrames project
        run: |
          if [ ! -d hyperframes ]; then
            echo "::error::No hyperframes/ folder. Create one with: npx hyperframes init hyperframes"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install ffmpeg and Chrome libraries
        run: |
          sudo apt-get update
          ASOUND=libasound2t64
          apt-cache show libasound2t64 >/dev/null 2>&1 || ASOUND=libasound2
          sudo apt-get install -y ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 \
            libgbm1 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libcups2 libpango-1.0-0 libcairo2 "$ASOUND"

      - name: Prepare browser and check the composition
        working-directory: hyperframes
        run: |
          npx --yes hyperframes browser ensure
          npx --yes hyperframes lint

      - name: Render
        working-directory: hyperframes
        run: |
          mkdir -p ../out
          npx --yes hyperframes render --quality delivery --output ../out/hyperframes.mp4

      - name: Add narration and thumbnail
        env:
          VOICEOVER: ${{ inputs.voiceover }}
        run: |
          if [ -n "$VOICEOVER" ] && [ -f "$VOICEOVER" ]; then
            ffmpeg -y -i out/hyperframes.mp4 -i "$VOICEOVER" \
              -map 0:v -map 1:a -c:v copy -c:a aac -b:a 192k \
              -af loudnorm=I=-16:TP=-1.5:LRA=11 -shortest out/final.mp4
          else
            cp out/hyperframes.mp4 out/final.mp4
          fi
          ffmpeg -y -ss 00:00:02 -i out/final.mp4 -frames:v 1 -q:v 2 out/thumbnail.jpg
          rm -f out/hyperframes.mp4
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_prefix }}final-video
          path: out/
          if-no-files-found: error

      - name: Draft release with the MP4
        if: inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "render-${GITHUB_RUN_NUMBER}" out/final.mp4 out/thumbnail.jpg \
            --draft --title "Render #${GITHUB_RUN_NUMBER}" \
            --notes "Rendered by workflow run ${GITHUB_RUN_ID}."
