<!doctype html><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:540px;height:960px;overflow:hidden}
body{font-family:"Inter Display",Inter,sans-serif;position:relative;background:var(--bg)}
.stage{position:absolute;inset:0;overflow:hidden}
.layer{position:absolute;inset:0}
.cap{position:absolute;left:0;right:0;text-align:center;font-weight:800;color:var(--ink);letter-spacing:-.5px}
.kw{font-family:Lora,serif;font-style:italic;font-weight:600;color:var(--accent)}
.prog{position:absolute;top:132px;left:36px;right:36px;display:flex;gap:6px}
.prog i{flex:1;height:4px;border-radius:2px;background:var(--track)}
.prog i.on{background:var(--accent)}
.num{position:absolute;top:300px;left:40px;font-family:Lora,serif;font-style:italic;font-size:46px;color:var(--accent);font-weight:600}
.num small{font-family:"Inter Display";font-style:normal;font-size:17px;color:var(--muted);font-weight:500}
.card{position:absolute;left:40px;right:40px;top:368px;height:250px;border-radius:16px;background:var(--card);
  box-shadow:var(--edge),0 3px 6px var(--sh1),0 26px 50px -12px var(--sh2);transform:perspective(1500px) rotateX(7deg) rotateY(-6deg);transform-origin:50% 100%}
.bar{height:34px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:0 14px}
.bar b{width:9px;height:9px;border-radius:50%;background:var(--dot)}
.url{margin-left:12px;flex:1;height:18px;border-radius:9px;background:var(--line);font:500 9px "DejaVu Sans Mono";color:var(--muted);display:flex;align-items:center;padding-left:10px}
.repo{padding:16px 18px;font:700 17px Inter;color:var(--cardink)}
.repo span{color:var(--accent2)}
.rows{padding:0 18px;display:grid;gap:9px}
.rows div{height:10px;border-radius:5px;background:var(--line)}
.stars{position:absolute;right:18px;top:48px;font:600 12px Inter;color:var(--cardink);padding:5px 9px;border-radius:7px;border:1px solid var(--line)}
.sweep{position:absolute;inset:0;border-radius:16px;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.13) 45%,transparent 55%)}
.av{position:absolute;bottom:0;filter:var(--avf)}
.av img{display:block;width:100%;-webkit-mask:radial-gradient(62% 120% at 50% 22%,#000 78%,transparent 96%)}
.contact{position:absolute;bottom:-18px;height:40px;border-radius:50%;background:radial-gradient(closest-side,var(--sh1),transparent)}
.tile{position:absolute;left:50%;transform:translateX(-50%) rotate(-2deg);top:232px;padding:10px 34px 14px;border-radius:18px;background:var(--tile);
 color:var(--tileink);font:900 92px "Inter Display";letter-spacing:-2px;box-shadow:inset 0 2px 0 rgba(255,255,255,.35),inset 0 -6px 0 rgba(0,0,0,.18),0 4px 8px var(--sh1),0 30px 50px -14px var(--sh2)}
.sign{position:absolute;top:388px;left:0;right:0;text-align:center;font-family:Lora,serif;font-style:italic;font-size:30px;color:var(--ink)}
.sign b{font-style:normal;font-family:"Inter Display";font-weight:800;color:var(--accent)}
.label{position:absolute;bottom:12px;right:14px;font:600 11px Inter;color:var(--muted);opacity:.8}
</style>
<div class="stage" id="s"></div>
<script>

const T={

  <div class=layer style="background:radial-gradient(60% 40% at 50% 60%,rgba(80,170,255,.14),transparent 70%),radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(2,8,20,.7))"></div>`},
 paper:{name:'4 · Paper Studio',v:{'--bg':'#efeae0','--ink':'#1b1a17','--muted':'#7c766a','--accent':'#e5492b','--accent2':'#c2381d','--track':'#d9d2c3',

  <div class=layer style="top:66%;height:2px;background:rgba(0,0,0,.05)"></div>
